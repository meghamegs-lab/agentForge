name: CI / Deploy

# ── Triggers ────────────────────────────────────────────────────────────────
# • Push to `main`        → detect changes → test relevant service → deploy if files changed
# • Push to `dev-mvp`     → detect changes → test relevant service → no deploy
# • PR targeting `main`   → detect changes → test relevant service → blocks merge on failure
on:
  push:
    branches:
      - main
      - dev-mvp
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────────────────
jobs:
  # ── Job 0: Detect which paths changed ─────────────────────────────────────
  # Every subsequent job uses these outputs to decide whether to run.
  # This avoids running Ghostfolio's heavy npm ci when only Python files changed,
  # and vice versa.
  changes:
    name: 'Detect changed paths'
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      ghostfolio: ${{ steps.filter.outputs.ghostfolio }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent:
              - 'apps/agent/**'
            ghostfolio:
              - 'apps/api/**'
              - 'apps/client/**'
              - 'libs/**'
              - 'prisma/**'
              - 'Dockerfile'
              - 'docker/**'
              - 'package.json'
              - 'package-lock.json'
              - 'nx.json'
              - 'tsconfig.base.json'

  # ── Job 1: Fortio Agent — lint + unit tests + eval tests ──────────────────
  # Only runs when files under apps/agent/ have changed.
  test-agent:
    name: 'Agent — lint + test'
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/agent/requirements.txt
            apps/agent/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — ruff
        run: ruff check agent/

      - name: Type check — mypy
        run: mypy agent/ --ignore-missing-imports
        continue-on-error: true # advisory — don't fail CI on type errors yet

      - name: Unit tests (required)
        run: pytest tests/unit/ -v --cov=agent --cov-report=xml --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: 'test-dummy-key-not-real'
          OPENAI_API_KEY: 'test-dummy-key-not-real'
          GHOSTFOLIO_BASE_URL: 'https://ghostfol.io'
          GHOSTFOLIO_ACCESS_TOKEN: 'test-dummy-token'
          LANGCHAIN_TRACING_V2: 'false'
          LANGCHAIN_API_KEY: 'test-dummy'
          LANGCHAIN_PROJECT: 'fortio-agent-ci'
          ENVIRONMENT: 'test'
          LOG_LEVEL: 'WARNING'
          PYTHONPATH: '.'

      - name: Eval tests — correctness + tool selection + edge cases (advisory)
        run: pytest tests/eval/ -v
        continue-on-error: true # advisory — results visible in CI but won't block deploy
        env:
          ANTHROPIC_API_KEY: 'test-dummy-key-not-real'
          OPENAI_API_KEY: 'test-dummy-key-not-real'
          GHOSTFOLIO_BASE_URL: 'https://ghostfol.io'
          GHOSTFOLIO_ACCESS_TOKEN: 'test-dummy-token'
          LANGCHAIN_TRACING_V2: 'false'
          LANGCHAIN_API_KEY: 'test-dummy'
          LANGCHAIN_PROJECT: 'fortio-agent-ci'
          ENVIRONMENT: 'test'
          LOG_LEVEL: 'WARNING'
          PYTHONPATH: '.'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-coverage
          path: apps/agent/coverage.xml
          retention-days: 7

  # ── Job 2: Ghostfolio (NX workspace) — lint + unit tests ──────────────────
  # Only runs when Ghostfolio source files have changed.
  test-ghostfolio:
    name: 'Ghostfolio — lint + test'
    needs: changes
    if: needs.changes.outputs.ghostfolio == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for NX affected commands
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc' # single source of truth — keep in sync with Dockerfile
          check-latest: true # always pull the newest patch of that major (satisfies >=22.18.0)
          cache: npm

      - name: Upgrade npm to match local (npm 11)
        run: npm install -g npm@latest

      - name: Install npm dependencies
        run: npm ci

      - name: Lint — format check
        run: npx nx format:check

      - name: Lint — NX all projects
        run: npx nx run-many --target=lint --all --parallel=2 --quiet

      - name: Unit tests — common library
        run: npx dotenv-cli -e .env.example -- npx nx test common --passWithNoTests
        continue-on-error: true # advisory — may need live DB

      - name: Unit tests — UI library
        run: npx dotenv-cli -e .env.example -- npx nx test ui --passWithNoTests
        continue-on-error: true

      - name: Unit tests — API (mocked)
        run: npx dotenv-cli -e .env.example -- npx nx test api --passWithNoTests
        continue-on-error: true # advisory until DB mock is fully set up

  # ── Job 3: Deploy Fortio Agent → Railway ──────────────────────────────────
  # Runs ONLY when:
  #   1. apps/agent/** files changed   (checked via `changes` job)
  #   2. test-agent passed             (enforced by `needs:`)
  #   3. This is a push to main        (not a PR, not dev-mvp)
  #
  # Independent of Ghostfolio — a Ghostfolio lint failure won't block this.
  #
  # Secrets required (GitHub repo → Settings → Secrets → Actions):
  #   RAILWAY_TOKEN      → railway.app → Account Settings → Tokens → Create token
  #   RAILWAY_PROJECT_ID → railway.app → Project → Settings → General → Project ID
  #
  # Service name "fortio-agent" must match the service name in Railway dashboard.
  # To use a service ID instead (more stable if you rename services):
  #   Replace --service fortio-agent with --service <UUID from Railway service Settings tab>
  deploy-agent:
    name: 'Deploy Fortio Agent → Railway'
    runs-on: ubuntu-latest
    needs: [changes, test-agent]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.agent == 'true'

    environment:
      name: production
      url: https://fortio-agent-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy Fortio Agent
        run: |
          echo "Deploying Fortio Agent service (apps/agent/)..."
          cd apps/agent
          railway up --service fortio-agent --environment production --detach
          echo "✅ Fortio Agent deploy triggered."
          echo "Monitor at: https://railway.app"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  # ── Job 4: Deploy Ghostfolio → Railway ────────────────────────────────────
  # Runs ONLY when:
  #   1. Ghostfolio source files changed  (checked via `changes` job)
  #   2. test-ghostfolio passed           (enforced by `needs:`)
  #   3. This is a push to main           (not a PR, not dev-mvp)
  #
  # Independent of Fortio Agent — agent test failures won't block this.
  deploy-ghostfolio:
    name: 'Deploy Ghostfolio → Railway'
    runs-on: ubuntu-latest
    needs: [changes, test-ghostfolio]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.ghostfolio == 'true'

    environment:
      name: production
      url: https://ghostfolio-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy Ghostfolio
        run: |
          echo "Deploying Ghostfolio service (repo root)..."
          railway up --service ghostfolio --environment production --detach
          echo "✅ Ghostfolio deploy triggered."
          echo "Monitor at: https://railway.app"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
