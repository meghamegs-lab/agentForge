name: Build code

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/client/**'
      - 'libs/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version:
          - 22
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'

      - name: Upgrade npm to match local (npm 11.8.0)
        run: npm install -g npm@11.8.0

      - name: Install dependencies
        run: npm install

      - name: Check code style
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Execute tests
        run: npm test

      - name: Build application
        run: npm run build:production
