version: "3.8"

# ════════════════════════════════════════════════════════════════
# AgentForge — Full Stack Docker Compose
# Runs: Ghostfolio (Angular + NestJS) + AI Agent (Chainlit + FastAPI)
#       + PostgreSQL + Redis (shared)
#
# Usage:
#   cp .env.example .env   # fill in API keys
#   docker compose up -d
#
# Services:
#   Ghostfolio UI + API  → http://localhost:3333
#   Agent Chainlit UI    → http://localhost:8000
#   Agent FastAPI docs   → http://localhost:8001/docs
# ════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL (shared by Ghostfolio + LangGraph checkpointing) ─
  postgres:
    image: postgres:15-alpine
    container_name: agentforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       ghostfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (shared by Ghostfolio + agent caching) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: agentforge_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ghostfolio (NestJS API + Angular UI) ─────────────────────────
  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    container_name: agentforge_ghostfolio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ghostfolio?sslmode=disable
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # App
      ACCESS_TOKEN_SALT: ${GHOSTFOLIO_ACCESS_TOKEN_SALT:-change-this-random-salt-32chars}
      JWT_SECRET_KEY:    ${GHOSTFOLIO_JWT_SECRET:-change-this-jwt-secret-also-32chars}
      # Optional: your API keys for Ghostfolio's own market data
      COINGECKO_API_KEY:  ${COINGECKO_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Python AI Agent (Chainlit dev UI + FastAPI) ───────────────────
  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    container_name: agentforge_agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ghostfolio:
        condition: service_healthy
    environment:
      # LLM keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:    ${OPENAI_API_KEY:-}
      # Ghostfolio — uses internal Docker network hostname
      GHOSTFOLIO_BASE_URL:       http://ghostfolio:3333
      GHOSTFOLIO_ACCESS_TOKEN:   ${GHOSTFOLIO_ACCESS_TOKEN:-}
      GHOSTFOLIO_PUBLIC_ACCESS_ID: ${GHOSTFOLIO_PUBLIC_ACCESS_ID:-}
      # Database (separate schema for agent state)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentforge?sslmode=disable
      # Redis
      REDIS_URL: redis://redis:6379/0
      # LangSmith
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY:    ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT:    ${LANGCHAIN_PROJECT:-ghostfolio-agent}
      # App
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL:   ${LOG_LEVEL:-INFO}
      PORTFOLIO_CONCENTRATION_THRESHOLD: ${PORTFOLIO_CONCENTRATION_THRESHOLD:-0.20}
    ports:
      - "8000:8000"   # Chainlit UI
      - "8001:8001"   # FastAPI REST
    volumes:
      - ./apps/agent:/app   # live reload in dev
    command: >
      sh -c "chainlit run agent/ui/chainlit_app.py --host 0.0.0.0 --port 8000 &
             uvicorn agent.api.main:app --host 0.0.0.0 --port 8001 --reload"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: agentforge_network
