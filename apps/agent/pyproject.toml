[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "fortio-agent"
version = "0.1.0"
description = "Fortio — an AI-powered personal finance assistant built on LangGraph and Ghostfolio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Fortio Contributors" }]
keywords = ["ai", "finance", "portfolio", "langgraph", "ghostfolio", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Office/Business :: Financial",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  # Core agent framework
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.2.0",
  "langchain-openai>=0.2.0",
  # API
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  # Data clients
  "httpx>=0.27.0",
  "yfinance>=0.2.40",
  "redis>=5.1.0",
  "psycopg2-binary>=2.9.9",
  # Observability
  "langsmith>=0.1.120",
  # Utilities
  "python-dotenv>=1.0.0",
  "tenacity>=9.0.0",
  "structlog>=24.0.0",
  "typer[all]>=0.12.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/meghamegs-lab/agentForge"
Repository = "https://github.com/meghamegs-lab/agentForge"
"Bug Tracker" = "https://github.com/meghamegs-lab/agentForge/issues"

[project.scripts]
fortio = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.coverage.run]
source = ["agent"]
# Exclude files that require integration tests (graph, API, UI)
omit = [
    "agent/graph/graph.py",
    "agent/graph/state.py",
    "agent/api/main.py",
    "agent/cli.py",
    "agent/prompts.py",
    "agent/mcp/server.py",
    "tests/eval/ls_evals.py",
]

[tool.coverage.report]
# These modules need integration tests — excluded from unit test coverage gate
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true